# ==============================================================================
# Local infrastructure for the Order Processing Platform.
#
# This is "Phase 1" from MICROSERVICES_PRACTICE.md:
#   Kafka + Kafka UI + PostgreSQL + Redis
# plus the three microservices for the "First Milestone" (section 31):
#   Order Service -> Kafka -> Inventory Service -> Kafka -> Payment Service
#
# Start everything:   docker compose up --build
# Watch one service:  docker compose logs -f order-service
# Stop everything:    docker compose down          (add -v to also wipe data)
# ==============================================================================

services:

  # ---------------------------------------------------------------------------
  # Kafka — the message broker all services talk through instead of calling
  # each other directly (REST). Running in "KRaft" mode, which means Kafka
  # manages its own metadata/consensus without needing a separate Zookeeper
  # cluster. That's why one container is enough for local practice.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      # Exposed to your host machine (e.g. so you can point a Kafka client
      # or the kafka-console-* CLI tools at localhost:9092).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # A single node plays both roles: it stores data (broker) AND
      # participates in cluster metadata consensus (controller).
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: one for traffic *inside* the docker network
      # (other containers use "kafka:29092"), one for traffic from your
      # host machine ("localhost:9092"), plus the controller's own port.
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Fine for a single-node dev cluster; a real cluster would use 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Lets services publish to a brand-new topic name without you having
      # to create it by hand first. Great for learning; a real cluster
      # usually turns this off so topics are created deliberately.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      # Keeps topics, messages and consumer offsets across
      # `docker compose down` / `up`. Without it they're wiped every time.
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 15

  # ---------------------------------------------------------------------------
  # Kafka UI — a web dashboard so you can *see* topics, partitions, messages,
  # and consumer groups instead of only using the CLI. Open http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PostgreSQL — one container, three databases (one per service). See
  # infra/postgres/init.sql for how the extra databases get created.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------------
  # Redis — not used by the code yet. It's started here because
  # MICROSERVICES_PRACTICE.md's Phase 1 infra includes it, ready for the
  # caching / rate-limiting / distributed-lock exercises (section 20).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # Order Service — the entry point. Exposes the REST API and owns the Saga
  # from the customer's point of view (creates the order, reacts to the
  # inventory/payment outcome).
  # ---------------------------------------------------------------------------
  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orderdb?sslmode=disable
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Inventory Service — reacts to OrderCreated, reserves (or fails to
  # reserve) stock, and releases stock again if payment later fails
  # (Saga compensation).
  # ---------------------------------------------------------------------------
  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventorydb?sslmode=disable
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Payment Service — reacts to InventoryReserved, simulates charging the
  # customer (randomly succeeds/fails so you can practice the failure path),
  # and reports the outcome back onto Kafka.
  # ---------------------------------------------------------------------------
  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/paymentdb?sslmode=disable
      KAFKA_BROKER: kafka:29092
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  kafka_data:
